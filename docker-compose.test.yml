name: sbts-phase2-test

services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sbts_test
      POSTGRES_USER: sbts_test
      POSTGRES_PASSWORD: sbts_test
    ports:
      - "127.0.0.1:${SBTS_TEST_DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sbts_test -d sbts_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
    restart: "no"
