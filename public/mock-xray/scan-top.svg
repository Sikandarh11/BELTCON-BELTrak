<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title description">
  <title id="title">Mock X-ray top view</title>
  <desc id="description">Synthetic baggage X-ray top view for HBSS integration development.</desc>
  <defs>
