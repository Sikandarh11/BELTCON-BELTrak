      <stop offset="0" stop-color="#173c5e"/>
      <stop offset="1" stop-color="#061529"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="640" height="400" rx="18" fill="url(#background)"/>
  <g opacity=".16" stroke="#67e8f9">
    <path d="M0 50h640M0 100h640M0 150h640M0 200h640M0 250h640M0 300h640M0 350h640"/>
    <path d="M64 0v400M128 0v400M192 0v400M256 0v400M320 0v400M384 0v400M448 0v400M512 0v400M576 0v400"/>
