<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title description">
  <title id="title">Mock X-ray density view</title>
  <desc id="description">Synthetic baggage X-ray density view for HBSS integration development.</desc>
  <defs>
    <linearGradient id="background" x1=".1" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset=".55" stop-color="#172554"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="640" height="400" rx="18" fill="url(#background)"/>
  <g opacity=".14" stroke="#c4b5fd">
    <path d="M0 80h640M0 160h640M0 240h640M0 320h640"/>
    <path d="M80 0v400M160 0v400M240 0v400M320 0v400M400 0v400M480 0v400M560 0v400"/>
  </g>
  <rect x="104" y="86" width="432" height="232" rx="48" fill="#818cf8" opacity=".12" stroke="#c4b5fd" stroke-width="6"/>
  <g filter="url(#glow)">
    <circle cx="226" cy="196" r="80" fill="#f97316" opacity=".68"/>
    <circle cx="226" cy="196" r="46" fill="#facc15" opacity=".78"/>
    <path d="M328 122h132v62H328z" fill="#38bdf8" opacity=".55"/>
    <path d="M348 222h96v58h-96z" fill="#a78bfa" opacity=".72"/>
    <path d="M465 199l43 28-26 49-47-31z" fill="#f8fafc" opacity=".68"/>
  </g>
  <g fill="#dbeafe" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="28" y="38" font-size="22" font-weight="700">MOCK X-RAY</text>
    <text x="28" y="62" font-size="13" opacity=".72">HBSS DENSITY VIEW · NOT FOR OPERATIONAL USE</text>
    <text x="473" y="374" font-size="12" opacity=".7">VIEW 03 / DENSITY</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">
    <rect x="28" y="336" width="18" height="8" fill="#38bdf8"/>
    <text x="52" y="344" fill="#bae6fd">LOW</text>
    <rect x="91" y="336" width="18" height="8" fill="#facc15"/>
    <text x="115" y="344" fill="#fef08a">MED</text>
    <rect x="154" y="336" width="18" height="8" fill="#f97316"/>
    <text x="178" y="344" fill="#fed7aa">HIGH DENSITY</text>
  </g>
</svg>
